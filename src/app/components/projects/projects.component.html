
<section id="projects" class="py-16 md:py-20 fade-in-up">
  <h2 class="text-3xl font-bold text-white text-center mb-16 tracking-wide">Projects</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    @for (project of projects; track project.name) {
      <div class="bg-gray-800 rounded-lg shadow-lg overflow-hidden flex flex-col transform hover:-translate-y-2 transition-transform duration-300">
        <div class="p-6 flex-grow">
          <h3 class="text-xl font-bold text-white mb-2">{{ project.name }}</h3>
          <p class="text-gray-400 mb-4 flex-grow">{{ project.description }}</p>
          <div class="flex flex-wrap gap-2">
            @for (tech of project.technologies; track tech) {
              <span class="bg-gray-700 text-teal-300 text-xs font-semibold px-2.5 py-0.5 rounded-full">{{ tech }}</span>
            }
          </div>
        </div>
        <div class="bg-gray-700 p-4">
          <a [href]="project.githubLink" target="_blank" class="text-teal-400 hover:text-teal-300 font-semibold flex items-center justify-center">
            View on GitHub
            <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
          </a>
        </div>
      </div>
    }
  </div>
</section>
