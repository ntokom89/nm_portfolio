<section id="contact" class="py-16 md:py-20 fade-in-up">
  <h2 class="text-3xl font-bold text-white text-center mb-16 tracking-wide">Get In Touch</h2>

  <div class="flex flex-col md:flex-row justify-center items-center gap-12 md:gap-16">
    <a [href]="'tel:' + personalInfo.phone" class="flex flex-col items-center text-center group">
      <span class="material-icons">call</span>
      <span class="text-sm font-medium text-gray-300 mt-2">{{ personalInfo.phone }}</span>
    </a>

    <a [href]="'mailto:' + personalInfo.email" class="flex flex-col items-center text-center group">
      <span class="material-icons">email</span>
      <span class="text-sm font-medium text-gray-300 mt-2">{{ personalInfo.email }}</span>
    </a>

    <div class="flex flex-col items-center text-center">
      <span class="material-icons">location_on</span>
      <span class="text-sm font-medium text-gray-300 mt-2">{{ personalInfo.location }}</span>
    </div>
  </div>
</section>
