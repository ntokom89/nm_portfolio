on:
  push:
    branches:
      - "portfolio-nm" # change to the branch you wish to deploy from

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Publish
        id: build-publish
        uses: bitovi/github-actions-angular-to-github-pages@v1.0.0